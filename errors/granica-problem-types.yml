note: >-
  Granica publishes no OpenAPI file on a public host, so this catalog is read from the published REST API
  reference rather than derived from 4xx/5xx response objects. The envelope is the FastAPI convention - a
  JSON body with a `detail` member - not application/problem+json, and the docs state plainly that "422
  indicates a validation error with detail in the response body". No numeric or symbolic error-code registry
  is published; the status code plus the detail string is the whole contract.
envelope:
