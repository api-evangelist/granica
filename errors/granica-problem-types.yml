  field: detail
  example_shape: '{"detail": "<validation or error description>"}'
  documented_at: https://docs.granica.ai/api-reference
status_codes:
- status: 200
  meaning: Success. Also used as "already enabled - no-op" on POST /object-maintenance/locations/{location_id}/prefixes/{prefix_id}/enable.
  retryable: false
- status: 201
  meaning: Resource created (table created, prefix newly enabled).
  retryable: false
- status: 204
  meaning: Deleted. Returned by DELETE /tables/{table_id} and DELETE /tables/{table_id}/schedule.
  retryable: false
- status: 404
  meaning: Resource not found - e.g. prefix or location not found on the enable-maintenance call.
  remediation: Verify the identifier; use GET /api/v1/tables?name=<name> to resolve a table ID from its unique name.
  retryable: false
- status: 409
  meaning: >-
    Conflict on POST /api/v1/tables when a table with that unique name already exists. The docs direct callers
    to resolve the existing table's ID with the name query filter on GET /api/v1/tables after a 409.
  remediation: GET /api/v1/tables?name=<name> to resolve the existing table ID, then update instead of creating.
  retryable: false
- status: 422
  meaning: >-
    Validation error. The canonical Granica error - returned for malformed bodies, invalid lifecycle
    transitions (enable maintenance on a prefix in an incompatible state), and state-precondition failures
    (retrying an Optimus submission whose effective status is not `failed`).
  remediation: Read the `detail` member of the response body; it names the failing field or precondition.
  retryable: false
