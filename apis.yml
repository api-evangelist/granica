apis:
- name: Granica APIs V1
  description: >-
    The Granica REST API (v1) lets you programmatically manage all aspects of the Granica platform, including
    table onboarding, compaction scheduling, catalog connections, query optimization (Optimus), vacuum,
    partition expiration, pending deletions and object maintenance. Base path is /api/v1 on the customer's own
    Granica Console / Admin Server host. All requests require a bearer API key; responses use standard HTTP
    status codes, with 422 carrying a validation error detail body.
  humanURL: https://docs.granica.ai/api-reference
  baseURL: https://{granica-console-host}/api/v1
