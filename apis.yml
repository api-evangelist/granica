aid: granica
name: Granica
description: >-
  Granica Computing, Inc. builds an efficiency and data-readiness layer for enterprise AI. Its flagship
  product, Granica Crunch, is a continuous, policy-driven data lakehouse optimization platform that handles
  compaction, compression, sorting, clustering, deduplication, vacuuming, partition lifecycle management and
  query acceleration for Delta Lake, Apache Iceberg and Hive tables sitting in Amazon S3, Google Cloud Storage
  and Azure. The platform is delivered as a customer-deployed control plane plus data plane (Granica Hosted,
  On-Premises and Hybrid deployment models on EKS or GKE inside the customer cloud account), so table data
  never has to leave the customer environment. Granica publishes a public REST API reference — the Granica
  APIs V1 surface at base path /api/v1 — covering tables, schedules, onboarding, crunch, vacuum, partition
  expiration, pending deletions, catalog connections, feature flags, Optimus query optimization and object
  maintenance, authenticated with long-lived bearer API keys carrying explicit read/write scopes. The company
  was formerly known as Project N (the Bolt product line), and still maintains the legacy Bolt SDKs under the
  project-n-oss GitHub organization.
