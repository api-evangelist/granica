note: >-
  Granica Computing, Inc. was formerly Project N, whose product line was called Bolt; the legacy SDKs are
  published under the project-n-oss GitHub organization and the co.projectn / com.gitlab.projectn-oss Maven
  groups. The PyPI package granica-sdk self-identifies as "Granica Python SDK" and points its homepage at
  github.com/project-n-oss/projectn-bolt-python, which is how first-party ownership was established. IMPORTANT
  CURRENCY FINDING - every first-party package below wraps the legacy Bolt S3 data-access path, not the current
  Granica APIs V1 REST surface documented at docs.granica.ai/api-reference, and the most recent release of any
  of them is 2024-06-07 (sidekick). Granica ships NO client SDK for the v1 REST API; the documented integration
  path is a bearer API key against /api/v1 directly.
